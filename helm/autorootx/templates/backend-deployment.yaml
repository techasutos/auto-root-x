apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autorootx.fullname" . }}-backend
  labels:
    {{- include "autorootx.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      {{- with .Values.global.podAnnotations }}
      annotations:
        {{- toYaml .Values.global.podAnnotations | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "autorootx.backendServiceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "autorootx.fullname" . }}-backend-config
          env:
            {{- toYaml .Values.backend.env | nindent 12 }}
            {{- with .Values.backend.secretEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- if .Values.backend.trivy.enabled }}
          volumeMounts:
            - name: trivy-report
              mountPath: {{ .Values.backend.trivy.report.mountPath }}
              readOnly: true
          {{- end }}
        {{- if .Values.backend.trivy.enabled }}
        - name: trivy-scanner
          image: "{{ .Values.backend.trivy.image.repository }}:{{ .Values.backend.trivy.image.tag }}"
          imagePullPolicy: {{ .Values.backend.trivy.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.backend.trivy.securityContext | nindent 12 }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              mkdir -p "$(dirname "$TRIVY_REPORT_PATH")"
              while true; do
                echo "Scanning ${TRIVY_TARGET_IMAGE} with Trivy"
                trivy image --format json --output "${TRIVY_REPORT_PATH}.tmp" "${TRIVY_TARGET_IMAGE}" \
                  && mv "${TRIVY_REPORT_PATH}.tmp" "${TRIVY_REPORT_PATH}" \
                  || echo "Trivy scan failed; keeping previous report if present"
                sleep "${TRIVY_INTERVAL_SECONDS}"
              done
          env:
            - name: TRIVY_TARGET_IMAGE
              value: {{ default (printf "%s:%s" .Values.backend.image.repository .Values.backend.image.tag) .Values.backend.trivy.targetImage | quote }}
            - name: TRIVY_REPORT_PATH
              value: {{ .Values.backend.trivy.reportPath | quote }}
            - name: TRIVY_INTERVAL_SECONDS
              value: {{ .Values.backend.trivy.intervalSeconds | quote }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -d "$(dirname "$TRIVY_REPORT_PATH")"
            initialDelaySeconds: {{ .Values.backend.trivy.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.trivy.readinessProbe.periodSeconds }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -d "$(dirname "$TRIVY_REPORT_PATH")"
            initialDelaySeconds: {{ .Values.backend.trivy.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.trivy.livenessProbe.periodSeconds }}
          volumeMounts:
            - name: trivy-report
              mountPath: {{ .Values.backend.trivy.report.mountPath }}
            {{- if .Values.backend.trivy.cache.enabled }}
            - name: trivy-cache
              mountPath: {{ .Values.backend.trivy.cache.mountPath }}
            {{- end }}
            {{- if .Values.backend.trivy.dockerConfig.enabled }}
            - name: trivy-docker-config
              mountPath: {{ .Values.backend.trivy.dockerConfig.mountPath }}
            {{- end }}
          resources:
            {{- toYaml .Values.backend.trivy.resources | nindent 12 }}
        {{- end }}
      {{- if .Values.backend.trivy.enabled }}
      volumes:
        - name: trivy-report
          emptyDir: {}
        {{- if .Values.backend.trivy.cache.enabled }}
        - name: trivy-cache
          emptyDir: {}
        {{- end }}
        {{- if .Values.backend.trivy.dockerConfig.enabled }}
        - name: trivy-docker-config
          secret:
            secretName: {{ .Values.backend.trivy.dockerConfig.secretName }}
        {{- end }}
      {{- end }}
