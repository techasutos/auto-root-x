apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autorootx.fullname" . }}-backend
  labels:
    {{- include "autorootx.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      {{- with .Values.global.podAnnotations }}
      annotations:
        {{- toYaml .Values.global.podAnnotations | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "autorootx.backendServiceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "autorootx.fullname" . }}-backend-config
          env:
            {{- toYaml .Values.backend.env | nindent 12 }}
            {{- with .Values.backend.secretEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
        {{- if .Values.backend.trivy.enabled }}
        - name: trivy-server
          image: "{{ .Values.backend.trivy.image.repository }}:{{ .Values.backend.trivy.image.tag }}"
          imagePullPolicy: {{ .Values.backend.trivy.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.backend.trivy.securityContext | nindent 12 }}
          args:
            - server
            - --listen
            - {{ .Values.backend.trivy.listen | quote }}
          ports:
            - containerPort: {{ .Values.backend.trivy.port }}
              name: trivy
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.trivy.readinessProbe.path }}
              port: trivy
            initialDelaySeconds: {{ .Values.backend.trivy.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.trivy.readinessProbe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.trivy.livenessProbe.path }}
              port: trivy
            initialDelaySeconds: {{ .Values.backend.trivy.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.trivy.livenessProbe.periodSeconds }}
          {{- if or .Values.backend.trivy.cache.enabled .Values.backend.trivy.dockerConfig.enabled }}
          volumeMounts:
            {{- if .Values.backend.trivy.cache.enabled }}
            - name: trivy-cache
              mountPath: {{ .Values.backend.trivy.cache.mountPath }}
            {{- end }}
            {{- if .Values.backend.trivy.dockerConfig.enabled }}
            - name: trivy-docker-config
              mountPath: {{ .Values.backend.trivy.dockerConfig.mountPath }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.backend.trivy.resources | nindent 12 }}
        {{- end }}
      {{- if and .Values.backend.trivy.enabled (or .Values.backend.trivy.cache.enabled .Values.backend.trivy.dockerConfig.enabled) }}
      volumes:
        {{- if .Values.backend.trivy.cache.enabled }}
        - name: trivy-cache
          emptyDir: {}
        {{- end }}
        {{- if .Values.backend.trivy.dockerConfig.enabled }}
        - name: trivy-docker-config
          secret:
            secretName: {{ .Values.backend.trivy.dockerConfig.secretName }}
        {{- end }}
      {{- end }}
