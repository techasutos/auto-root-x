apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autorootx.fullname" . }}-frontend
  labels:
    {{- include "autorootx.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      annotations:
        checksum/frontend-nginx-config: {{ include (print $.Template.BasePath "/frontend-nginx-configmap.yaml") . | sha256sum }}
        {{- with .Values.global.podAnnotations }}
        {{- toYaml .Values.global.podAnnotations | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.frontend.podSecurityContext | nindent 8 }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.frontend.waitForBackend.enabled }}
      initContainers:
        - name: wait-for-backend
          image: "{{ .Values.frontend.waitForBackend.image.repository }}:{{ .Values.frontend.waitForBackend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.waitForBackend.image.pullPolicy }}
          command:
            - sh
            - -c
          args:
            - |
              set -eu
              url="http://{{ include "autorootx.fullname" . }}-backend:{{ .Values.backend.service.port }}/api/health"
              for i in $(seq 1 {{ .Values.frontend.waitForBackend.maxAttempts }}); do
                if curl -fsS "$url"; then
                  echo "Backend API is reachable at $url"
                  exit 0
                fi
                echo "Waiting for backend API at $url (${i}/{{ .Values.frontend.waitForBackend.maxAttempts }})"
                sleep {{ .Values.frontend.waitForBackend.sleepSeconds }}
              done
              echo "Backend API did not become reachable at $url"
              exit 1
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.frontend.securityContext | nindent 12 }}
          ports:
            - containerPort: {{ .Values.frontend.containerPort }}
              name: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: frontend-nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: frontend-nginx-config
          configMap:
            name: {{ include "autorootx.fullname" . }}-frontend-nginx
