apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "autorootx.fullname" . }}-backend-config
  labels:
    {{- include "autorootx.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  APP_CORS_ALLOWED_ORIGINS: {{ .Values.backend.config.appCorsAllowedOrigins | quote }}
  GCP_PROJECT: {{ .Values.backend.config.gcpProject | quote }}
  GCP_REGION: {{ .Values.backend.config.gcpRegion | quote }}
  VERTEX_MODEL: {{ .Values.backend.config.vertexModel | quote }}
  VERTEX_RETRY_MAX_ATTEMPTS: {{ .Values.backend.config.vertexRetryMaxAttempts | quote }}
  VERTEX_RETRY_INITIAL_BACKOFF_MS: {{ .Values.backend.config.vertexRetryInitialBackoffMs | quote }}
  VERTEX_RETRY_MAX_BACKOFF_MS: {{ .Values.backend.config.vertexRetryMaxBackoffMs | quote }}
  VERTEX_CIRCUIT_FAILURE_THRESHOLD: {{ .Values.backend.config.vertexCircuitFailureThreshold | quote }}
  VERTEX_CIRCUIT_OPEN_DURATION_MS: {{ .Values.backend.config.vertexCircuitOpenDurationMs | quote }}
  VERTEX_RATE_LIMIT_MAX_CALLS_PER_MINUTE: {{ .Values.backend.config.vertexRateLimitMaxCallsPerMinute | quote }}
  VERTEX_COST_INPUT_PER_1K_USD: {{ .Values.backend.config.vertexCostInputPer1kUsd | quote }}
  VERTEX_COST_OUTPUT_PER_1K_USD: {{ .Values.backend.config.vertexCostOutputPer1kUsd | quote }}
  TRIVY_ENABLED: {{ .Values.backend.config.trivyEnabled | quote }}
  TRIVY_URL: {{ .Values.backend.config.trivyUrl | quote }}
  TRIVY_SCAN_ENDPOINT: {{ .Values.backend.config.trivyScanEndpoint | quote }}
  TRIVY_EXPECTED_MAJOR: {{ .Values.backend.config.trivyExpectedMajor | quote }}
  LOGS_LOOKBACK_MINUTES: {{ .Values.backend.config.logsLookbackMinutes | quote }}
  LOGS_MAX_ENTRIES: {{ .Values.backend.config.logsMaxEntries | quote }}
  LOGS_FILTER: {{ .Values.backend.config.logsFilter | quote }}
  SERVICENOW_MOCK: {{ .Values.backend.config.serviceNowMockMode | quote }}
  SERVICENOW_URL: {{ .Values.backend.config.serviceNowUrl | quote }}
  SERVICENOW_USER: {{ .Values.backend.config.serviceNowUser | quote }}