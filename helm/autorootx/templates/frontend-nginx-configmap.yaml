apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "autorootx.fullname" . }}-frontend-nginx
  labels:
    {{- include "autorootx.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
        set $autorootx_backend "http://{{ include "autorootx.fullname" . }}-backend.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.backend.service.port }}";

        root /usr/share/nginx/html;
        index index.html;

        location = /api {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_pass $autorootx_backend;
        }

        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_pass $autorootx_backend;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
