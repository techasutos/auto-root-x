{{- if .Values.backend.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "autorootx.backendServiceAccountName" . }}
  {{- with .Values.backend.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "autorootx.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
{{- end }}