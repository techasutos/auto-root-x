nameOverride: ""
fullnameOverride: ""

global:
  imagePullSecrets: []
  commonLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

backend:
  replicaCount: 1
  image:
    repository: us-central1-docker.pkg.dev/YOUR_PROJECT/autorootx/backend
    tag: latest
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ""
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: false
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
    - name: GCP_REGION
      value: us-central1
  config:
    appCorsAllowedOrigins: "https://example.com"
    gcpProject: "my-gcp-project"
    gcpRegion: "us-central1"
    vertexModel: "gemini-1.5-pro"
    serviceNowMockMode: "true"
    serviceNowUrl: ""
    serviceNowUser: ""
  secretEnv:
    - name: SERVICENOW_PASS
      valueFrom:
        secretKeyRef:
          name: autorootx-secrets
          key: servicenow-password
          optional: true

frontend:
  replicaCount: 1
  image:
    repository: us-central1-docker.pkg.dev/YOUR_PROJECT/autorootx/frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: false

networkPolicy:
  enabled: true

ingress:
  enabled: true
  className: "gce"
  annotations:
    kubernetes.io/ingress.allow-http: "false"
    kubernetes.io/ingress.global-static-ip-name: ""
    networking.gke.io/managed-certificates: ""
  host: autorootx.example.com
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""
