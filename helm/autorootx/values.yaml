nameOverride: ""
fullnameOverride: ""

global:
  imagePullSecrets: []
  commonLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

backend:
  replicaCount: 1
  image:
    repository: us-central1-docker.pkg.dev/YOUR_PROJECT/autorootx/backend
    tag: latest
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: false
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
    - name: GCP_REGION
      value: us-central1
  config:
    appCorsAllowedOrigins: "*"
    gcpProject: "auto-root-x-495307"
    gcpRegion: "us-central1"
    vertexModel: "gemini-1.5-pro"
    vertexRetryMaxAttempts: "3"
    vertexRetryInitialBackoffMs: "400"
    vertexRetryMaxBackoffMs: "4000"
    vertexCircuitFailureThreshold: "5"
    vertexCircuitOpenDurationMs: "30000"
    vertexRateLimitMaxCallsPerMinute: "60"
    vertexCostInputPer1kUsd: "0.00035"
    vertexCostOutputPer1kUsd: "0.00105"
    trivyEnabled: "true"
    trivyReportPath: "/var/run/autorootx/trivy/report.json"
    trivyRequireImageMatch: "false"
    logsLookbackMinutes: "30"
    logsMaxEntries: "200"
    logsFilter: ""
    serviceNowMockMode: "true"
    serviceNowUrl: ""
    serviceNowUser: ""
  secretEnv:
    - name: SERVICENOW_PASS
      valueFrom:
        secretKeyRef:
          name: autorootx-secrets
          key: servicenow-password
          optional: true
  trivy:
    enabled: true
    image:
      repository: aquasec/trivy
      tag: 0.53.0
      pullPolicy: IfNotPresent
    targetImage: ""
    intervalSeconds: 3600
    reportPath: "/var/run/autorootx/trivy/report.json"
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: false
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    readinessProbe:
      initialDelaySeconds: 45
      periodSeconds: 10
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
    report:
      mountPath: /var/run/autorootx/trivy
    cache:
      enabled: true
      mountPath: /root/.cache/trivy
    dockerConfig:
      enabled: false
      secretName: regcred
      mountPath: /root/.docker

frontend:
  replicaCount: 1
  image:
    repository: us-central1-docker.pkg.dev/YOUR_PROJECT/autorootx/frontend
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: false

networkPolicy:
  enabled: true

ingress:
  enabled: true
  className: "gce"
  annotations:
    kubernetes.io/ingress.allow-http: "true"
    kubernetes.io/ingress.global-static-ip-name: ""
    networking.gke.io/managed-certificates: ""
  host: ""
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""
