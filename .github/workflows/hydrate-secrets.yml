name: Hydrate Runtime Secrets

on:
  workflow_dispatch:

env:
  REGION: us-central1
  CLUSTER_NAME: autorootx-cluster
  K8S_NAMESPACE: autorootx

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup kubectl
        run: gcloud components install gke-gcloud-auth-plugin kubectl --quiet

      - name: Get GKE credentials
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: gcloud container clusters get-credentials ${CLUSTER_NAME} --region ${REGION} --project ${PROJECT_ID}

      - name: Sync Secret Manager values to Kubernetes
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          kubectl create namespace ${K8S_NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -

          SERVICENOW_PASSWORD="$(gcloud secrets versions access latest --secret=autorootx-servicenow-password --project=${PROJECT_ID})"

          kubectl create secret generic autorootx-secrets \
            --namespace ${K8S_NAMESPACE} \
            --from-literal=servicenow-password="${SERVICENOW_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -