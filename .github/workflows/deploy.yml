name: Deploy to GKE

on:
  workflow_dispatch:

env:
  REGION: us-central1
  GAR_REPOSITORY: autorootx
  CLUSTER_NAME: autorootx-cluster
  HELM_RELEASE: autorootx
  HELM_NAMESPACE: autorootx
  STATIC_IP_NAME: autorootx-ip
  TRIVY_IMAGE: aquasec/trivy:0.53.0
  TRIVY_SEVERITY: HIGH,CRITICAL

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Setup kubectl and Helm
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Ensure Artifact Registry repo exists
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud artifacts repositories create ${GAR_REPOSITORY} \
            --repository-format=docker \
            --location=${REGION} \
            --description="AutoRootX images" \
            --project=${PROJECT_ID} || true

      - name: Ensure global static IP exists
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if ! gcloud compute addresses describe ${STATIC_IP_NAME} --global --project=${PROJECT_ID} >/dev/null 2>&1; then
            gcloud compute addresses create ${STATIC_IP_NAME} --global --project=${PROJECT_ID}
          fi

          STATIC_IP_ADDRESS="$(gcloud compute addresses describe ${STATIC_IP_NAME} --global --project=${PROJECT_ID} --format='value(address)')"
          echo "STATIC_IP_ADDRESS=${STATIC_IP_ADDRESS}" >> $GITHUB_ENV
          echo "Reserved static IP ${STATIC_IP_NAME}: ${STATIC_IP_ADDRESS}"

      - name: Prepare Trivy reports
        run: mkdir -p trivy-reports

      - name: Build Backend Image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          BACKEND_IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/backend:${GITHUB_SHA}
          docker build -f Dockerfile/backend/dockerfile -t ${BACKEND_IMAGE} autoroot-x
          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> $GITHUB_ENV

      - name: Scan Backend Image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-reports:/reports" \
            -v trivy-cache:/root/.cache/trivy \
            ${TRIVY_IMAGE} image \
              --scanners vuln \
              --severity ${TRIVY_SEVERITY} \
              --format json \
              --output /reports/backend-trivy.json \
              ${BACKEND_IMAGE}

      - name: Push Backend Image
        run: docker push ${BACKEND_IMAGE}

      - name: Build Frontend Image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          FRONTEND_IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/frontend:${GITHUB_SHA}
          docker build -f Dockerfile/frontend/dockerfile -t ${FRONTEND_IMAGE} autorootx-ui
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> $GITHUB_ENV

      - name: Scan Frontend Image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-reports:/reports" \
            -v trivy-cache:/root/.cache/trivy \
            ${TRIVY_IMAGE} image \
              --scanners vuln \
              --severity ${TRIVY_SEVERITY} \
              --format json \
              --output /reports/frontend-trivy.json \
              ${FRONTEND_IMAGE}

      - name: Push Frontend Image
        run: docker push ${FRONTEND_IMAGE}

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-scan-reports
          path: trivy-reports/*.json
          if-no-files-found: warn

      - name: Get GKE credentials
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud container clusters get-credentials ${CLUSTER_NAME} --region ${REGION} --project ${PROJECT_ID}

      - name: Verify runtime secret exists
        run: kubectl get secret autorootx-secrets -n ${HELM_NAMESPACE}

      - name: Helm Deploy
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          kubectl create namespace ${HELM_NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -

          helm upgrade --install ${HELM_RELEASE} helm/autorootx \
            --namespace ${HELM_NAMESPACE} \
            --set backend.serviceAccount.name=autorootx-backend \
            --set-string 'backend.serviceAccount.annotations.iam\.gke\.io/gcp-service-account=autorootx-backend@'"${PROJECT_ID}"'.iam.gserviceaccount.com' \
            --set backend.config.gcpProject=${PROJECT_ID} \
            --set backend.config.gcpRegion=${REGION} \
            --set backend.image.repository=${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/backend \
            --set backend.image.tag=${GITHUB_SHA} \
            --set-string backend.config.trivyEnabled=true \
            --set-string backend.config.trivyRequireImageMatch=true \
            --set backend.trivy.enabled=true \
            --set backend.trivy.image.repository=aquasec/trivy \
            --set backend.trivy.image.tag=0.53.0 \
            --set-string backend.trivy.targetImage=${BACKEND_IMAGE} \
            --set-string backend.trivy.reportPath=/var/run/autorootx/trivy/report.json \
            --set frontend.image.repository=${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/frontend \
            --set frontend.image.tag=${GITHUB_SHA} \
            --set ingress.host="" \
            --set-string 'ingress.annotations.kubernetes\.io/ingress\.allow-http=true' \
            --set-string 'ingress.annotations.kubernetes\.io/ingress\.global-static-ip-name='"${STATIC_IP_NAME}"

      - name: Verify backend API is reachable from frontend path
        run: |
          BACKEND_DEPLOYMENT=${HELM_RELEASE}-autorootx-backend
          FRONTEND_DEPLOYMENT=${HELM_RELEASE}-autorootx-frontend
          FRONTEND_SERVICE=${HELM_RELEASE}-autorootx-frontend
          BACKEND_SERVICE=${HELM_RELEASE}-autorootx-backend
          SMOKE_POD=autorootx-api-smoke-${GITHUB_RUN_ID}

          kubectl -n ${HELM_NAMESPACE} rollout status deployment/${BACKEND_DEPLOYMENT} --timeout=240s
          kubectl -n ${HELM_NAMESPACE} rollout status deployment/${FRONTEND_DEPLOYMENT} --timeout=240s

          kubectl -n ${HELM_NAMESPACE} get pods -o wide
          kubectl -n ${HELM_NAMESPACE} get svc ${BACKEND_SERVICE} ${FRONTEND_SERVICE}
          kubectl -n ${HELM_NAMESPACE} get endpoints ${BACKEND_SERVICE} ${FRONTEND_SERVICE}
          kubectl -n ${HELM_NAMESPACE} exec deployment/${FRONTEND_DEPLOYMENT} -c frontend -- cat /etc/nginx/conf.d/default.conf

          kubectl -n ${HELM_NAMESPACE} run ${SMOKE_POD} \
            --rm \
            --attach \
            --restart=Never \
            --image=curlimages/curl:8.10.1 \
            --labels=app.kubernetes.io/instance=${HELM_RELEASE},app.kubernetes.io/component=frontend \
            --command -- sh -c "curl -fsS http://${FRONTEND_SERVICE}/ && echo && curl -fsS http://${FRONTEND_SERVICE}/api/health"

      - name: Publish static URL
        run: |
          echo "### AutoRoot-X URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Static IP name: \`${STATIC_IP_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "Static IP address: \`${STATIC_IP_ADDRESS}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- UI: http://${STATIC_IP_ADDRESS}/" >> $GITHUB_STEP_SUMMARY
          echo "- API health: http://${STATIC_IP_ADDRESS}/api/health" >> $GITHUB_STEP_SUMMARY
          kubectl -n ${HELM_NAMESPACE} get ingress ${HELM_RELEASE}-autorootx || true

      - name: Dump API connectivity diagnostics
        if: failure()
        run: |
          BACKEND_DEPLOYMENT=${HELM_RELEASE}-autorootx-backend
          FRONTEND_DEPLOYMENT=${HELM_RELEASE}-autorootx-frontend
          BACKEND_SERVICE=${HELM_RELEASE}-autorootx-backend
          FRONTEND_SERVICE=${HELM_RELEASE}-autorootx-frontend
          DIAG_POD=autorootx-api-diag-${GITHUB_RUN_ID}

          kubectl -n ${HELM_NAMESPACE} get pods -o wide || true
          kubectl -n ${HELM_NAMESPACE} get svc ${BACKEND_SERVICE} ${FRONTEND_SERVICE} || true
          kubectl -n ${HELM_NAMESPACE} get endpoints ${BACKEND_SERVICE} ${FRONTEND_SERVICE} || true
          kubectl -n ${HELM_NAMESPACE} describe svc ${BACKEND_SERVICE} || true
          kubectl -n ${HELM_NAMESPACE} describe networkpolicy || true
          kubectl -n ${HELM_NAMESPACE} logs deployment/${FRONTEND_DEPLOYMENT} -c frontend --tail=120 || true
          kubectl -n ${HELM_NAMESPACE} logs deployment/${BACKEND_DEPLOYMENT} -c backend --tail=160 || true
          kubectl -n ${HELM_NAMESPACE} exec deployment/${FRONTEND_DEPLOYMENT} -c frontend -- cat /etc/nginx/conf.d/default.conf || true

          kubectl -n ${HELM_NAMESPACE} run ${DIAG_POD} \
            --rm \
            --attach \
            --restart=Never \
            --image=curlimages/curl:8.10.1 \
            --labels=app.kubernetes.io/instance=${HELM_RELEASE},app.kubernetes.io/component=frontend \
            --command -- sh -c "curl -v http://${BACKEND_SERVICE}:8080/api/health; echo; curl -v http://${FRONTEND_SERVICE}/api/health" || true
