name: Deploy to GKE

on:
  push:
    branches: [ "main" ]

env:
  REGION: us-central1
  GAR_REPOSITORY: autorootx
  CLUSTER_NAME: autorootx-cluster
  HELM_RELEASE: autorootx
  HELM_NAMESPACE: autorootx

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Setup kubectl and Helm
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Ensure Artifact Registry repo exists
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud artifacts repositories create ${GAR_REPOSITORY} \
            --repository-format=docker \
            --location=${REGION} \
            --description="AutoRootX images" \
            --project=${PROJECT_ID} || true

      - name: Build and Push Backend
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          BACKEND_IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/backend:${GITHUB_SHA}
          docker build -f Dockerfile/backend/dockerfile -t ${BACKEND_IMAGE} autoroot-x
          docker push ${BACKEND_IMAGE}
          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> $GITHUB_ENV

      - name: Build and Push Frontend
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          FRONTEND_IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/frontend:${GITHUB_SHA}
          docker build -f Dockerfile/frontend/dockerfile -t ${FRONTEND_IMAGE} autorootx-ui
          docker push ${FRONTEND_IMAGE}
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> $GITHUB_ENV

      - name: Get GKE credentials
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud container clusters get-credentials ${CLUSTER_NAME} --region ${REGION} --project ${PROJECT_ID}

      - name: Helm Deploy
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          kubectl create namespace ${HELM_NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -

          helm upgrade --install ${HELM_RELEASE} helm/autorootx \
            --namespace ${HELM_NAMESPACE} \
            --set backend.image.repository=${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/backend \
            --set backend.image.tag=${GITHUB_SHA} \
            --set frontend.image.repository=${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/frontend \
            --set frontend.image.tag=${GITHUB_SHA}