name: Deploy to GKE

on:
  workflow_dispatch:

env:
  REGION: us-central1
  GAR_REPOSITORY: autorootx
  CLUSTER_NAME: autorootx-cluster
  HELM_RELEASE: autorootx
  HELM_NAMESPACE: autorootx
  TRIVY_IMAGE: aquasec/trivy:0.53.0
  TRIVY_SEVERITY: HIGH,CRITICAL

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Setup kubectl and Helm
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Ensure Artifact Registry repo exists
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud artifacts repositories create ${GAR_REPOSITORY} \
            --repository-format=docker \
            --location=${REGION} \
            --description="AutoRootX images" \
            --project=${PROJECT_ID} || true

      - name: Prepare Trivy reports
        run: mkdir -p trivy-reports

      - name: Build Backend Image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          BACKEND_IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/backend:${GITHUB_SHA}
          docker build -f Dockerfile/backend/dockerfile -t ${BACKEND_IMAGE} autoroot-x
          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> $GITHUB_ENV

      - name: Scan Backend Image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-reports:/reports" \
            -v trivy-cache:/root/.cache/trivy \
            ${TRIVY_IMAGE} image \
              --scanners vuln \
              --severity ${TRIVY_SEVERITY} \
              --format json \
              --output /reports/backend-trivy.json \
              ${BACKEND_IMAGE}

      - name: Push Backend Image
        run: docker push ${BACKEND_IMAGE}

      - name: Build Frontend Image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          FRONTEND_IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/frontend:${GITHUB_SHA}
          docker build -f Dockerfile/frontend/dockerfile -t ${FRONTEND_IMAGE} autorootx-ui
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> $GITHUB_ENV

      - name: Scan Frontend Image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-reports:/reports" \
            -v trivy-cache:/root/.cache/trivy \
            ${TRIVY_IMAGE} image \
              --scanners vuln \
              --severity ${TRIVY_SEVERITY} \
              --format json \
              --output /reports/frontend-trivy.json \
              ${FRONTEND_IMAGE}

      - name: Push Frontend Image
        run: docker push ${FRONTEND_IMAGE}

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-scan-reports
          path: trivy-reports/*.json
          if-no-files-found: warn

      - name: Get GKE credentials
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud container clusters get-credentials ${CLUSTER_NAME} --region ${REGION} --project ${PROJECT_ID}

      - name: Verify runtime secret exists
        run: kubectl get secret autorootx-secrets -n ${HELM_NAMESPACE}

      - name: Helm Deploy
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          kubectl create namespace ${HELM_NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -

          helm upgrade --install ${HELM_RELEASE} helm/autorootx \
            --namespace ${HELM_NAMESPACE} \
            --set backend.serviceAccount.name=autorootx-backend \
            --set-string 'backend.serviceAccount.annotations.iam\.gke\.io/gcp-service-account=autorootx-backend@'"${PROJECT_ID}"'.iam.gserviceaccount.com' \
            --set backend.config.gcpProject=${PROJECT_ID} \
            --set backend.config.gcpRegion=${REGION} \
            --set backend.image.repository=${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/backend \
            --set backend.image.tag=${GITHUB_SHA} \
            --set-string backend.config.trivyEnabled=true \
            --set-string backend.config.trivyRequireImageMatch=true \
            --set backend.trivy.enabled=true \
            --set backend.trivy.image.repository=aquasec/trivy \
            --set backend.trivy.image.tag=0.53.0 \
            --set-string backend.trivy.targetImage=${BACKEND_IMAGE} \
            --set-string backend.trivy.reportPath=/var/run/autorootx/trivy/report.json \
            --set frontend.image.repository=${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/frontend \
            --set frontend.image.tag=${GITHUB_SHA}
