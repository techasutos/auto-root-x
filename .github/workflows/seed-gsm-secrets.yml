name: Seed Secret Manager Secrets

on:
  workflow_dispatch:

env:
  GSM_SECRET_SERVICENOW_PASSWORD: autorootx-servicenow-password

jobs:
  seed-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
            

      # - name: Ensure required APIs are enabled
      #   env:
      #     PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      #   run: |
      #     gcloud services enable serviceusage.googleapis.com secretmanager.googleapis.com \
      #       --project=${PROJECT_ID}

      #     # API activation can take a short time to propagate in fresh projects.
      #     for i in $(seq 1 18); do
      #       ENABLED_SERVICE=$(gcloud services list --enabled \
      #         --project=${PROJECT_ID} \
      #         --filter="name:secretmanager.googleapis.com" \
      #         --format="value(name)")

      #       if [ "${ENABLED_SERVICE}" = "secretmanager.googleapis.com" ]; then
      #         echo "Secret Manager API is enabled."
      #         break
      #       fi

      #       if [ "${i}" -eq 18 ]; then
      #         echo "Timed out waiting for Secret Manager API enablement to propagate."
      #         exit 1
      #       fi

      #       echo "Waiting for Secret Manager API enablement to propagate... (${i}/18)"
      #       sleep 10
      #     done

      - name: Ensure ServiceNow password secret exists in Secret Manager
        run: |
          gcloud secrets create ${GSM_SECRET_SERVICENOW_PASSWORD} \
            --replication-policy=automatic \
            --project=${{ secrets.GCP_PROJECT_ID }} || true

      - name: Add latest ServiceNow password version
        env:
          SERVICENOW_PASSWORD: ${{ secrets.AUTOROOTX_SERVICENOW_PASSWORD }}
        run: |
          if [ -z "${SERVICENOW_PASSWORD}" ]; then
            echo "GitHub secret AUTOROOTX_SERVICENOW_PASSWORD is required to seed Secret Manager."
            exit 1
          fi

          printf '%s' "${SERVICENOW_PASSWORD}" | gcloud secrets versions add ${GSM_SECRET_SERVICENOW_PASSWORD} \
            --data-file=- \
            --project=${{ secrets.GCP_PROJECT_ID }}
