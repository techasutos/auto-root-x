name: Seed Secret Manager Secrets

on:
  workflow_dispatch:

env:
  GSM_SECRET_SERVICENOW_PASSWORD: autorootx-servicenow-password

jobs:
  seed-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud with Workload Identity Federation
        if: ${{ secrets.GCP_WIF_PROVIDER != '' && secrets.GCP_WIF_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud with service account key
        if: ${{ secrets.GCP_WIF_PROVIDER == '' || secrets.GCP_WIF_SERVICE_ACCOUNT == '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Ensure ServiceNow password secret exists in Secret Manager
        run: |
          gcloud secrets create ${GSM_SECRET_SERVICENOW_PASSWORD} \
            --replication-policy=automatic \
            --project=${{ secrets.GCP_PROJECT_ID }} || true

      - name: Add latest ServiceNow password version
        env:
          SERVICENOW_PASSWORD: ${{ secrets.AUTOROOTX_SERVICENOW_PASSWORD }}
        run: |
          if [ -z "${SERVICENOW_PASSWORD}" ]; then
            echo "GitHub secret AUTOROOTX_SERVICENOW_PASSWORD is required to seed Secret Manager."
            exit 1
          fi

          printf '%s' "${SERVICENOW_PASSWORD}" | gcloud secrets versions add ${GSM_SECRET_SERVICENOW_PASSWORD} \
            --data-file=- \
            --project=${{ secrets.GCP_PROJECT_ID }}