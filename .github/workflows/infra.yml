name: Provision GKE Infrastructure

on:
  workflow_dispatch:

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  GOOGLE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
  TF_VAR_region: us-central1
  TF_STATE_BUCKET: ${{ format('{0}-tfstate', secrets.GCP_PROJECT_ID) }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Ensure required APIs are enabled
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud services enable \
            serviceusage.googleapis.com \
            compute.googleapis.com \
            container.googleapis.com \
            iam.googleapis.com \
            iamcredentials.googleapis.com \
            sts.googleapis.com \
            artifactregistry.googleapis.com \
            secretmanager.googleapis.com \
            logging.googleapis.com \
            monitoring.googleapis.com \
            aiplatform.googleapis.com \
            --project=${PROJECT_ID}

          # Fresh projects can require a short propagation period after API enablement.
          REQUIRED_SERVICES="compute.googleapis.com container.googleapis.com iam.googleapis.com iamcredentials.googleapis.com sts.googleapis.com"
          for i in $(seq 1 24); do
            MISSING=""
            for svc in ${REQUIRED_SERVICES}; do
              if ! gcloud services describe ${svc} --project=${PROJECT_ID} --enabled >/dev/null 2>&1; then
                MISSING="${MISSING} ${svc}"
              fi
            done

            if [ -z "${MISSING}" ]; then
              echo "Required APIs are enabled."
              break
            fi

            if [ "${i}" -eq 24 ]; then
              echo "Timed out waiting for API enablement to propagate. Missing:${MISSING}"
              exit 1
            fi

            echo "Waiting for API enablement to propagate... (${i}/24) Missing:${MISSING}"
            sleep 10
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Ensure Terraform state bucket exists
        run: |
          gcloud storage buckets create gs://${TF_STATE_BUCKET} \
            --location=${TF_VAR_region} \
            --uniform-bucket-level-access || true

      - name: Terraform Init
        working-directory: infra
        run: terraform init -reconfigure -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="prefix=terraform/state"

      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve tfplan