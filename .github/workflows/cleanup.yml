name: Cleanup GCP Environment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY to continue
        required: true
        type: string
      delete_secret_manager_secrets:
        description: Delete Secret Manager runtime secrets
        required: true
        default: false
        type: boolean
      delete_tf_state_bucket:
        description: Delete the Terraform state bucket after destroy
        required: true
        default: false
        type: boolean

env:
  REGION: us-central1
  GAR_REPOSITORY: autorootx
  CLUSTER_NAME: autorootx-cluster
  HELM_RELEASE: autorootx
  HELM_NAMESPACE: autorootx
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
  TF_VAR_region: us-central1
  TF_STATE_BUCKET: ${{ format('{0}-tfstate', secrets.GCP_PROJECT_ID) }}
  GSM_SECRET_SERVICENOW_PASSWORD: autorootx-servicenow-password

jobs:
  destroy:
    if: ${{ inputs.confirmation == 'DESTROY' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup kubectl and Helm
        run: |
          gcloud components install gke-gcloud-auth-plugin kubectl --quiet
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Best-effort uninstall of Helm release
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud container clusters get-credentials ${CLUSTER_NAME} --region ${REGION} --project ${PROJECT_ID} || true
          helm uninstall ${HELM_RELEASE} --namespace ${HELM_NAMESPACE} || true
          kubectl delete secret autorootx-secrets -n ${HELM_NAMESPACE} || true
          kubectl delete namespace ${HELM_NAMESPACE} || true

      - name: Terraform Init
        working-directory: infra
        run: terraform init -reconfigure -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="prefix=terraform/state"

      - name: Terraform Destroy
        working-directory: infra
        run: terraform destroy -auto-approve

      - name: Delete Artifact Registry repository
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud artifacts repositories delete ${GAR_REPOSITORY} \
            --location=${REGION} \
            --project=${PROJECT_ID} \
            --quiet || true

      - name: Delete Secret Manager secrets
        if: ${{ inputs.delete_secret_manager_secrets }}
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud secrets delete ${GSM_SECRET_SERVICENOW_PASSWORD} --project=${PROJECT_ID} --quiet || true

      - name: Delete Terraform state bucket
        if: ${{ inputs.delete_tf_state_bucket }}
        run: |
          gcloud storage rm --recursive gs://${TF_STATE_BUCKET} || true
          gcloud storage buckets delete gs://${TF_STATE_BUCKET} || true