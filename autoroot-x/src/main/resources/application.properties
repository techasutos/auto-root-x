spring.application.name=autoroot-x
app.cors.allowed-origins=http://localhost:5173
management.endpoints.web.exposure.include=health,info

# GCP / Vertex AI override via env vars GCP_PROJECT, GCP_REGION, VERTEX_MODEL
gcp.project=${GCP_PROJECT:my-gcp-project}
gcp.region=${GCP_REGION:us-central1}
vertex.model=${VERTEX_MODEL:gemini-1.5-pro}
vertex.retry.max-attempts=${VERTEX_RETRY_MAX_ATTEMPTS:3}
vertex.retry.initial-backoff-ms=${VERTEX_RETRY_INITIAL_BACKOFF_MS:400}
vertex.retry.max-backoff-ms=${VERTEX_RETRY_MAX_BACKOFF_MS:4000}
vertex.circuit.failure-threshold=${VERTEX_CIRCUIT_FAILURE_THRESHOLD:5}
vertex.circuit.open-duration-ms=${VERTEX_CIRCUIT_OPEN_DURATION_MS:30000}
vertex.ratelimit.max-calls-per-minute=${VERTEX_RATE_LIMIT_MAX_CALLS_PER_MINUTE:60}
vertex.cost.input-per-1k-usd=${VERTEX_COST_INPUT_PER_1K_USD:0.00035}
vertex.cost.output-per-1k-usd=${VERTEX_COST_OUTPUT_PER_1K_USD:0.00105}

# ServiceNow -- set servicenow.mock-mode=false and provide credentials for real integration
servicenow.mock-mode=${SERVICENOW_MOCK:true}
servicenow.instance-url=${SERVICENOW_URL:}
servicenow.username=${SERVICENOW_USER:}
servicenow.password=${SERVICENOW_PASS:}

# Trivy sidecar scanner
trivy.enabled=${TRIVY_ENABLED:true}
trivy.report-path=${TRIVY_REPORT_PATH:/var/run/autorootx/trivy/report.json}
trivy.require-image-match=${TRIVY_REQUIRE_IMAGE_MATCH:false}

# Cloud Logging fetch tuning for Logs Analyzer
logs.lookback-minutes=${LOGS_LOOKBACK_MINUTES:30}
logs.max-entries=${LOGS_MAX_ENTRIES:200}
logs.filter=${LOGS_FILTER:}
